services:
  postgres:
    image: postgres:16-alpine
    container_name: linksnip-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-linksnip}
      POSTGRES_USER: ${DB_USERNAME:-linksnip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linksnip}
    ports:
      - "5433:5432" # host 5433 avoids clashing with a locally-running Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-linksnip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linksnip-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: linksnip-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-linksnip}
      DB_USERNAME: ${DB_USERNAME:-linksnip}
      DB_PASSWORD: ${DB_PASSWORD:-linksnip}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-please-override-in-prod-env-min-32-bytes!!}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-dev-only-pepper-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
